<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAT Prep – James – Test 1 Q6</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Segoe UI", sans-serif; background: #f0f4f8; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px; }
.header { text-align: center; margin-bottom: 16px; }
.header h1 { font-size: 1.2em; color: #1a3a5c; }
.header h2 { font-size: 0.9em; color: #4a6fa5; font-weight: normal; margin-top: 4px; }
.progress { font-size: 0.85em; color: #555; margin-bottom: 12px; }
.game-area { width: 100%; max-width: 500px; }
.columns { display: flex; gap: 12px; }
.column { flex: 1; display: flex; flex-direction: column; gap: 8px; }
.word-card { background: white; border: 2px solid #c0cfe0; border-radius: 10px; padding: 10px 8px; text-align: center; font-size: 0.9em; cursor: grab; user-select: none; min-height: 48px; display: flex; align-items: center; justify-content: center; }
.word-card.dragging { opacity: 0.5; border-color: #4a6fa5; }
.word-card.correct { background: #d4edda; border-color: #28a745; color: #155724; cursor: default; }
.word-card.incorrect { background: #f8d7da; border-color: #dc3545; }
.drop-zone { background: #eaf0fb; border: 2px dashed #a0b8d8; border-radius: 10px; padding: 10px 8px; text-align: center; font-size: 0.9em; min-height: 48px; display: flex; align-items: center; justify-content: center; color: #555; }
.drop-zone.over { background: #d0e4ff; border-color: #4a6fa5; }
.drop-zone.filled { background: white; border: 2px solid #c0cfe0; color: #333; }
.drop-zone.correct { background: #d4edda; border-color: #28a745; color: #155724; }
.drop-zone.incorrect { background: #f8d7da; border-color: #dc3545; }
.btn { margin-top: 16px; padding: 12px 32px; font-size: 1em; background: #4a6fa5; color: white; border: none; border-radius: 8px; cursor: pointer; width: 100%; max-width: 500px; }
.btn:disabled { background: #aaa; cursor: not-allowed; }
.btn:hover:not(:disabled) { background: #3a5f95; }
.passage-box { background: white; border: 2px solid #c0cfe0; border-radius: 12px; padding: 20px; margin-bottom: 16px; line-height: 1.7; font-size: 0.95em; max-width: 500px; width: 100%; white-space: pre-wrap; }
.mcq-box { background: white; border: 2px solid #c0cfe0; border-radius: 12px; padding: 20px; max-width: 500px; width: 100%; }
.mcq-question { font-weight: 600; margin-bottom: 16px; line-height: 1.5; }
.mcq-option { padding: 12px 16px; border: 2px solid #c0cfe0; border-radius: 8px; margin-bottom: 10px; cursor: pointer; line-height: 1.4; }
.mcq-option:hover { background: #eaf0fb; border-color: #4a6fa5; }
.mcq-option.correct { background: #d4edda; border-color: #28a745; color: #155724; cursor: default; }
.mcq-option.incorrect { background: #f8d7da; border-color: #dc3545; cursor: default; }
.overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
.overlay.show { display: flex; }
.modal { background: white; border-radius: 16px; padding: 32px 24px; text-align: center; max-width: 320px; width: 90%; }
.modal h2 { font-size: 1.4em; margin-bottom: 12px; }
.modal p { color: #555; margin-bottom: 20px; font-size: 0.95em; }
.modal .btn { margin-top: 0; }
.name-form input { width: 100%; padding: 10px; border: 2px solid #c0cfe0; border-radius: 8px; font-size: 0.95em; margin-bottom: 12px; }
.phase-label { font-size: 0.8em; color: #4a6fa5; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="header"><h1>SAT Prep – James</h1><h2>Test 1 – Question 6 of 50</h2></div>
<div class="overlay show" id="name-overlay"><div class="modal name-form"><h2>Welcome!</h2><p>Enter your name to begin.</p><input type="text" id="name-input" placeholder="James" /><button class="btn" onclick="startGame()">Start</button></div></div>
<div class="overlay" id="penalty-overlay"><div class="modal"><h2>Not Quite!</h2><p>Going back one round. Try again!</p><button class="btn" onclick="dismissPenalty()">OK</button></div></div>
<div class="overlay" id="round-overlay"><div class="modal"><h2>Round Complete!</h2><p id="round-msg"></p><button class="btn" onclick="nextRound()">Continue</button></div></div>
<div class="overlay" id="vocab-done-overlay"><div class="modal"><h2>Vocab Complete!</h2><p>Great work! Now read the passage and answer the question.</p><button class="btn" onclick="showPassage()">Continue</button></div></div>
<div class="overlay" id="mcq-overlay"><div class="modal"><h2 id="mcq-result-title"></h2><p id="mcq-result-msg"></p><button class="btn" id="mcq-next-btn" onclick="goNext()">Continue</button></div></div>
<div id="vocab-phase" style="display:none; flex-direction:column; align-items:center; width:100%;">
<div class="phase-label">Vocabulary Matching</div>
<div class="progress" id="progress-text">Round 1</div>
<div class="game-area"><div class="columns"><div class="column" id="left-col"></div><div class="column" id="right-col"></div></div></div>
<button class="btn" id="check-btn" onclick="checkAnswers()" disabled>Check Answers</button>
</div>
<div id="passage-phase" style="display:none; flex-direction:column; align-items:center; width:100%;">
<div class="phase-label">Reading Passage</div>
<div class="passage-box" id="passage-text"></div>
<button class="btn" onclick="showQuestion()">Go to Question</button>
</div>
<div id="mcq-phase" style="display:none; flex-direction:column; align-items:center; width:100%;">
<div class="phase-label">Multiple Choice</div>
<div class="mcq-box"><div class="mcq-question" id="mcq-question-text"></div><div id="mcq-options"></div></div>
</div>
<iframe name="hidden-iframe" style="display:none"></iframe>
<script>
var SHEET_URL = "https://script.google.com/macros/s/AKfycbwaRtctDHQiLjKo-HPnOQVXyTHDBKCWiv8pS2K_aqgq277lGOf35TcUXrmUzwMeCok/exec";
var TEST_NUM = 1;
var Q_NUM = 6;
var TOTAL_Q = 50;
var NEXT_URL = "test1-q7-james.html";
var DRAG_LANG = "kor";
var ROUNDS = [[{"eng":"attribute meaning to","kor":"~에 의미를 부여하다"},{"eng":"point upwards","kor":"위쪽을 가리키다"},{"eng":"speculate about","kor":"~에 대해 추측하다"},{"eng":"text","kor":"글, 지문"}],[{"eng":"natural","kor":"자연의, 자연적인"},{"eng":"description","kor":"묘사, 설명"},{"eng":"influence","kor":"영향"},{"eng":"type of","kor":"~의 한 종류"}],[{"eng":"ponder what something means","kor":"무언가가 무엇을 의미하는지 곰곰이 생각하다"},{"eng":"upwards","kor":"위쪽으로, 위를 향하여"},{"eng":"natural sight","kor":"자연의 모습, 자연에서 볼 수 있는 광경"},{"eng":"describe a distinctive sight in nature","kor":"자연에서 눈에 띄는 광경을 묘사하다"}],[{"eng":"outdoor scene","kor":"야외 풍경"},{"eng":"just","kor":"방금, 막"},{"eng":"attribute meaning to","kor":"~에 의미를 부여하다"},{"eng":"why are you ~?","kor":"너는 왜 ~한가?"}],[{"eng":"why are you pointing upwards?","kor":"너는 왜 위쪽을 가리키고 있는가?"},{"eng":"describe","kor":"묘사하다"},{"eng":"emotional state","kor":"감정 상태"},{"eng":"still","kor":"고요한, 움직이지 않는"}],[{"eng":"poem","kor":"시"},{"eng":"against","kor":"~을 배경으로"},{"eng":"against a gold sky","kor":"금빛 하늘을 배경으로"},{"eng":"gold","kor":"금빛의, 황금색의"}],[{"eng":"look","kor":"보다, 바라보다"},{"eng":"thing","kor":"것, 사물"},{"eng":"sight","kor":"광경, 모습, 시야"},{"eng":"point upwards","kor":"위쪽을 가리키다"}],[{"eng":"in nature","kor":"자연에서"},{"eng":"interpretation","kor":"해석"},{"eng":"evergreen tree","kor":"상록수"},{"eng":"question","kor":"질문하다, 의문을 제기하다"}],[{"eng":"accuracy of","kor":"~의 정확성"},{"eng":"state","kor":"상태"},{"eng":"have just seen","kor":"방금 보았다"},{"eng":"human behavior","kor":"인간의 행동"}],[{"eng":"meaning","kor":"의미"},{"eng":"Black American writer","kor":"흑인 미국 작가"},{"eng":"be black","kor":"검다, 검은색이다"},{"eng":"natural phenomenon","kor":"자연 현상"}],[{"eng":"Black Finger","kor":"검은 손가락"},{"eng":"black","kor":"검은, 검은색의"},{"eng":"attribute","kor":"~의 의미로 여기다, ~의 탓으로 돌리다"},{"eng":"influence on","kor":"~에 대한 영향"}],[{"eng":"a type of evergreen tree","kor":"상록수의 한 종류"},{"eng":"nature","kor":"자연"},{"eng":"be from","kor":"~에서 발췌되다, ~에서 가져오다"},{"eng":"most beautiful","kor":"가장 아름다운, 매우 아름다운"}],[{"eng":"straight","kor":"곧은, 곧게 뻗은"},{"eng":"a straight black cypress","kor":"곧게 뻗은 검은 사이프러스"},{"eng":"why","kor":"왜"},{"eng":"point","kor":"가리키다"}],[{"eng":"interpret","kor":"해석하다"},{"eng":"surroundings","kor":"주변 환경"},{"eng":"question the accuracy of","kor":"~의 정확성에 의문을 제기하다"},{"eng":"examine","kor":"살펴보다, 조사하다"}],[{"eng":"finger","kor":"손가락"},{"eng":"meaning","kor":"의미"},{"eng":"distinctive sight","kor":"눈에 띄는 광경"},{"eng":"distinctive","kor":"독특한, 눈에 띄는"}],[{"eng":"beautiful still finger","kor":"아름답고 고요한 손가락"},{"eng":"overall structure","kor":"전체적인 구조"},{"eng":"ponder what meaning to attribute to","kor":"어떤 의미를 부여할지 곰곰이 생각하다"},{"eng":"accuracy of her assessment","kor":"그녀의 판단의 정확성"}],[{"eng":"speculate","kor":"추측하다"},{"eng":"exquisite","kor":"매우 아름다운, 정교한, 우아한"},{"eng":"cypress","kor":"사이프러스, 편백나무류"},{"eng":"beautiful","kor":"아름다운"}],[{"eng":"emotional","kor":"감정적인"},{"eng":"slim","kor":"가늘고 날씬한"},{"eng":"ponder","kor":"곰곰이 생각하다"},{"eng":"scene","kor":"장면, 풍경"}],[{"eng":"accuracy","kor":"정확성"},{"eng":"see","kor":"보다"},{"eng":"sensitive","kor":"섬세한"},{"eng":"why are you black?","kor":"너는 왜 검은가?"}],[{"eng":"sky","kor":"하늘"},{"eng":"following","kor":"다음의, 다음에 나오는"},{"eng":"assessment","kor":"평가, 판단"},{"eng":"most beautiful thing","kor":"아주 아름다운 것"}],[{"eng":"describe a distinctive sight","kor":"눈에 띄는 광경을 묘사하다"},{"eng":"speaker","kor":"화자"},{"eng":"writer","kor":"작가"},{"eng":"a black finger","kor":"검은 손가락"}],[{"eng":"behavior","kor":"행동, 행태"},{"eng":"sensitive and exquisite","kor":"섬세하고 아름다운"},{"eng":"assess","kor":"평가하다, 판단하다"},{"eng":"distinctive","kor":"독특한, 눈에 띄는"}]];
var PASSAGE = "다음 글은 흑인 미국 작가 안젤리나 웰드 그림케(Angelina Weld Grimké)가 1923년에 쓴 시 「Black Finger」에서 발췌한 것이다.사이프러스(cypress)는 상록수의 한 종류이다.나는 방금아주 아름다운 것을 보았다.금빛, 금빛 하늘을 배경으로가늘고 고요하게 서 있는,곧게 뻗은 검은 사이프러스 나무.섬세하고,아름다운,하나의 검은 손가락처럼위쪽을 가리키고 있다.아, 아름답고 고요한 손가락이여, 너는 왜 검은가? 그리고 너는 왜 위쪽을 가리키고 있는가?";
var QUESTION = "Which choice best describes the overall structure of the text?";
var ANSWERS = ["The speaker assesses a natural phenomenon, then questions the accuracy of her assessment.","The speaker describes a distinctive sight in nature, then ponders what meaning to attribute to that sight.","The speaker presents an outdoor scene, then considers a human behavior occurring within that scene.","The speaker examines her surroundings, then speculates about their influence on her emotional state."];
var CORRECT = "B";
var LETTERS = ["A","B","C","D","E","F"];
var userName = "", currentRound = 0, filledDrops = {}, dragSrc = null;
var touchDragEl = null, touchClone = null, touchOffsetX = 0, touchOffsetY = 0;
function startGame() {
  var input = document.getElementById("name-input").value.trim();
  if (!input) { alert("Please enter your name."); return; }
  userName = input;
  document.getElementById("name-overlay").classList.remove("show");
  document.getElementById("vocab-phase").style.display = "flex";
  loadRound(0);
}
document.addEventListener("DOMContentLoaded", function() {
  var inp = document.getElementById("name-input");
  if (inp) inp.addEventListener("keydown", function(e) { if (e.key === "Enter") startGame(); });
});
function loadRound(idx) {
  currentRound = idx; filledDrops = {};
  document.getElementById("progress-text").textContent = "Round " + (idx+1) + " of " + ROUNDS.length;
  document.getElementById("check-btn").disabled = true;
  var round = ROUNDS[idx];
  var dragItems = round.map(function(p) { return DRAG_LANG === "eng" ? p.eng : p.kor; });
  var dropItems = round.map(function(p) { return DRAG_LANG === "eng" ? p.kor : p.eng; });
  var shuffledDrag = dragItems.slice().sort(function() { return Math.random()-0.5; });
  var shuffledDrop = dropItems.slice().sort(function() { return Math.random()-0.5; });
  var leftCol = document.getElementById("left-col"), rightCol = document.getElementById("right-col");
  leftCol.innerHTML = ""; rightCol.innerHTML = "";
  shuffledDrag.forEach(function(word) {
    var card = document.createElement("div");
    card.className = "word-card"; card.textContent = word; card.dataset.word = word;
    addDragTouch(card); leftCol.appendChild(card);
  });
  shuffledDrop.forEach(function(word) {
    var dz = document.createElement("div");
    dz.className = "drop-zone"; dz.dataset.word = word; dz.textContent = word;
    dz.addEventListener("dragover", function(e) { e.preventDefault(); dz.classList.add("over"); });
    dz.addEventListener("dragleave", function() { dz.classList.remove("over"); });
    dz.addEventListener("drop", function(e) { e.preventDefault(); dz.classList.remove("over"); if (dragSrc) performDrop(dragSrc, dz); dragSrc = null; });
    rightCol.appendChild(dz);
  });
}
function addDragTouch(card) {
  card.draggable = true;
  card.addEventListener("dragstart", function(e) { dragSrc = card; card.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; });
  card.addEventListener("dragend", function() { card.classList.remove("dragging"); });
  card.addEventListener("touchstart", onTouchStart, {passive:false});
  card.addEventListener("touchmove", onTouchMove, {passive:false});
  card.addEventListener("touchend", onTouchEnd, {passive:false});
}
function onTouchStart(e) {
  e.preventDefault(); touchDragEl = e.currentTarget;
  var touch = e.touches[0], rect = touchDragEl.getBoundingClientRect();
  touchOffsetX = touch.clientX - rect.left; touchOffsetY = touch.clientY - rect.top;
  touchClone = touchDragEl.cloneNode(true);
  touchClone.style.cssText = "position:fixed;width:" + rect.width + "px;opacity:0.8;z-index:9999;pointer-events:none;left:" + (touch.clientX-touchOffsetX) + "px;top:" + (touch.clientY-touchOffsetY) + "px;";
  document.body.appendChild(touchClone); touchDragEl.style.opacity = "0.3";
}
function onTouchMove(e) {
  e.preventDefault(); if (!touchClone) return;
  var touch = e.touches[0];
  touchClone.style.left = (touch.clientX-touchOffsetX) + "px";
  touchClone.style.top = (touch.clientY-touchOffsetY) + "px";
  document.querySelectorAll(".drop-zone").forEach(function(dz) { dz.classList.remove("over"); });
  touchClone.style.display = "none";
  var el = document.elementFromPoint(touch.clientX, touch.clientY);
  touchClone.style.display = "";
  var dz = el ? el.closest(".drop-zone") : null;
  if (dz) dz.classList.add("over");
}
function onTouchEnd(e) {
  e.preventDefault(); if (!touchClone || !touchDragEl) return;
  var touch = e.changedTouches[0];
  document.querySelectorAll(".drop-zone").forEach(function(dz) { dz.classList.remove("over"); });
  touchClone.style.display = "none";
  var el = document.elementFromPoint(touch.clientX, touch.clientY);
  touchClone.style.display = "";
  var dz = el ? el.closest(".drop-zone") : null;
  document.body.removeChild(touchClone); touchClone = null;
  if (dz) performDrop(touchDragEl, dz); else touchDragEl.style.opacity = "1";
  touchDragEl = null;
}
function performDrop(card, dz) {
  var dragWord = card.dataset.word, dropWord = dz.dataset.word;
  if (filledDrops[dropWord]) returnToBank(filledDrops[dropWord]);
  var prevDrop = card.dataset.currentDz;
  if (prevDrop && prevDrop !== dropWord) {
    delete filledDrops[prevDrop];
    document.querySelectorAll(".drop-zone").forEach(function(z) { if (z.dataset.word === prevDrop) { z.classList.remove("filled"); z.textContent = prevDrop; } });
  }
  filledDrops[dropWord] = dragWord; card.dataset.currentDz = dropWord;
  card.style.display = "none"; dz.classList.add("filled");
  dz.textContent = dropWord + " <- " + dragWord;
  checkAllFilled();
}
function returnToBank(dragWord) {
  document.getElementById("left-col").querySelectorAll(".word-card").forEach(function(card) {
    if (card.dataset.word === dragWord) { card.style.display = "flex"; card.style.opacity = "1"; card.dataset.currentDz = ""; }
  });
}
function checkAllFilled() {
  document.getElementById("check-btn").disabled = Object.keys(filledDrops).length < document.querySelectorAll(".drop-zone").length;
}
function checkAnswers() {
  var round = ROUNDS[currentRound], correctMap = {};
  round.forEach(function(p) {
    var dropWord = DRAG_LANG === "eng" ? p.kor : p.eng;
    var dragWord = DRAG_LANG === "eng" ? p.eng : p.kor;
    correctMap[dropWord] = dragWord;
  });
  var allCorrect = true;
  document.querySelectorAll(".drop-zone").forEach(function(dz) {
    var drop = dz.dataset.word, drag = filledDrops[drop];
    if (drag === correctMap[drop]) {
      dz.classList.add("correct");
      document.querySelectorAll(".word-card").forEach(function(c) { if (c.dataset.word === drag) c.classList.add("correct"); });
    } else { dz.classList.add("incorrect"); allCorrect = false; }
  });
  if (allCorrect) {
    if (currentRound + 1 >= ROUNDS.length) {
      sendVocabResult();
      setTimeout(function() { document.getElementById("vocab-done-overlay").classList.add("show"); }, 600);
    } else {
      setTimeout(function() {
        document.getElementById("round-msg").textContent = "Round " + (currentRound+1) + " done! On to round " + (currentRound+2) + ".";
        document.getElementById("round-overlay").classList.add("show");
      }, 600);
    }
  } else { setTimeout(function() { document.getElementById("penalty-overlay").classList.add("show"); }, 600); }
}
function nextRound() { document.getElementById("round-overlay").classList.remove("show"); loadRound(currentRound+1); }
function dismissPenalty() { document.getElementById("penalty-overlay").classList.remove("show"); loadRound(Math.max(0, currentRound-1)); }
function showPassage() {
  document.getElementById("vocab-done-overlay").classList.remove("show");
  document.getElementById("vocab-phase").style.display = "none";
  document.getElementById("passage-phase").style.display = "flex";
  document.getElementById("passage-text").textContent = PASSAGE;
}
function showQuestion() {
  document.getElementById("passage-phase").style.display = "none";
  document.getElementById("mcq-phase").style.display = "flex";
  document.getElementById("mcq-question-text").textContent = QUESTION;
  var optDiv = document.getElementById("mcq-options"); optDiv.innerHTML = "";
  ANSWERS.forEach(function(ans, i) {
    var div = document.createElement("div");
    div.className = "mcq-option"; div.textContent = LETTERS[i] + ") " + ans;
    div.dataset.letter = LETTERS[i];
    div.addEventListener("click", function() { selectAnswer(div); });
    optDiv.appendChild(div);
  });
}
function selectAnswer(div) {
  document.querySelectorAll(".mcq-option").forEach(function(o) { o.style.pointerEvents = "none"; });
  setTimeout(function() { submitAnswer(div.dataset.letter); }, 300);
}
function submitAnswer(chosen) {
  var isCorrect = chosen === CORRECT;
  document.querySelectorAll(".mcq-option").forEach(function(o) {
    if (o.dataset.letter === CORRECT) o.classList.add("correct");
    else if (o.dataset.letter === chosen && !isCorrect) o.classList.add("incorrect");
  });
  sendMCQResult(chosen, isCorrect);
  document.getElementById("mcq-result-title").textContent = isCorrect ? "Correct!" : "Not quite";
  document.getElementById("mcq-result-msg").textContent = isCorrect ? "Well done! Moving to the next question." : "The correct answer was " + CORRECT + ". Keep going!";
  document.getElementById("mcq-next-btn").textContent = NEXT_URL ? "Next Question" : "Test Complete!";
  setTimeout(function() { document.getElementById("mcq-overlay").classList.add("show"); }, 800);
}
function goNext() { if (NEXT_URL) window.location.href = NEXT_URL; else alert("You have completed this test! Well done!"); }
function sendVocabResult() { sendResult({user:userName, test:"Test"+TEST_NUM, question:"Q"+Q_NUM, type:"vocab", result:"complete", answer:""}); }
function sendMCQResult(chosen, isCorrect) { sendResult({user:userName, test:"Test"+TEST_NUM, question:"Q"+Q_NUM, type:"mcq", result:isCorrect?"correct":"incorrect", answer:chosen}); }
function sendResult(data) {
  var now = new Date();
  data.date = now.toLocaleDateString(); data.time = now.toLocaleTimeString();
  var payload = JSON.stringify(data);
  var form = document.createElement("form");
  form.method = "POST"; form.action = SHEET_URL; form.target = "hidden-iframe";
  var inp = document.createElement("input");
  inp.type = "hidden"; inp.name = "data"; inp.value = payload;
  form.appendChild(inp); document.body.appendChild(form); form.submit(); document.body.removeChild(form);
}
</script>
</body>
</html>
